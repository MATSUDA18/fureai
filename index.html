<style>
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:#FCF4F5;color:#5A4A50;font-family:"Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;}
  textarea,input,button{font-family:inherit;}

  .top{max-width:560px;margin:0 auto;padding:0 16px 40px;}
  .hero{position:relative;overflow:hidden;border-radius:0 0 28px 28px;background:linear-gradient(180deg,#FBDCE4 0%,#FCF4F5 100%);padding:22px 18px 26px;}
  .hero-photo{border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(201,120,143,.18);border:3px solid #fff;}
  .hero-img{display:block;width:100%;height:auto;}
  .hero-title{text-align:center;margin-top:16px;position:relative;z-index:2;}
  .pref{color:#C9788F;font-weight:700;letter-spacing:.12em;margin:0 0 2px;font-size:13px;}
  .hero-title h1{margin:0;font-size:30px;color:#B25E77;letter-spacing:.04em;}
  .sub{margin:6px 0 0;color:#94808A;font-size:13px;}

  .petal-field{position:absolute;inset:0;pointer-events:none;z-index:1;}
  .petal{position:absolute;top:-24px;border-radius:80% 10% 80% 10%;opacity:.85;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite;}
  @keyframes fall{0%{transform:translateY(-24px) translateX(0) rotate(var(--rot));opacity:0;}10%{opacity:.9;}50%{transform:translateY(160px) translateX(var(--sway)) rotate(calc(var(--rot) + 180deg));}100%{transform:translateY(340px) translateX(0) rotate(calc(var(--rot) + 360deg));opacity:0;}}
  @media (prefers-reduced-motion: reduce){.petal{animation:none;display:none;}}

  .news{width:100%;margin:18px 0 4px;border:none;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#fff;box-shadow:0 0 0 2px rgba(228,87,122,.13),0 8px 20px rgba(228,87,122,.15);animation:glow 2.6s ease-in-out infinite;}
  @keyframes glow{0%,100%{box-shadow:0 0 0 2px rgba(228,87,122,.13),0 8px 20px rgba(228,87,122,.15);}50%{box-shadow:0 0 0 3px rgba(228,87,122,.27),0 10px 26px rgba(228,87,122,.28);}}
  .news-badge{display:inline-flex;align-items:center;gap:5px;background:#E4577A;color:#fff;font-weight:700;font-size:12px;padding:5px 9px;border-radius:999px;white-space:nowrap;}
  .news-main{display:flex;flex-direction:column;}
  .news-main b{color:#5A4A50;font-size:14px;}
  .news-main em{color:#94808A;font-style:normal;font-size:11px;margin-top:2px;}

  .card{background:#fff;border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 6px 20px rgba(201,120,143,.10);border:1px solid #F0D3DB;}
  .card h2{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:16px;color:#C9788F;}
  .name-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .name-chip{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid #F0D3DB;background:#FBEAEE;cursor:pointer;transition:transform .12s,background .12s;}
  .name-chip:hover{background:#F6D4DD;transform:translateY(-1px);}
  .avatar{width:34px;height:34px;border-radius:50%;background:#E79AB0;color:#fff;display:grid;place-items:center;font-weight:700;font-family:"Zen Maru Gothic";}
  .avatar.sm{width:28px;height:28px;font-size:13px;}
  .nm{font-weight:500;}
  .tag{margin-left:auto;font-size:10px;background:#C9788F;color:#fff;padding:2px 7px;border-radius:999px;}

  .foot-actions{display:flex;gap:12px;margin-top:18px;}
  .foot-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:16px;border:1px dashed #E79AB0;background:#fff;color:#C9788F;font-weight:700;cursor:pointer;}
  .foot-btn.hotaru{border-color:#C7B45A;color:#8C7A2E;background:linear-gradient(180deg,#FFFDF3,#fff);}
  .footer-note{text-align:center;color:#94808A;font-size:11px;margin-top:22px;}

  .ov{position:fixed;inset:0;background:rgba(90,74,80,.35);display:grid;place-items:center;z-index:50;padding:18px;}
  .modal{width:100%;max-width:440px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:90vh;display:flex;flex-direction:column;}
  .modal-head{color:#fff;padding:14px 16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
  .modal-body{padding:18px;overflow:auto;}
  .icon-btn{background:transparent;border:none;color:#fff;cursor:pointer;font-size:18px;}
  .hint{display:flex;gap:6px;align-items:flex-start;color:#94808A;font-size:13px;margin:0 0 12px;line-height:1.6;}
  .field{display:block;margin-bottom:12px;}
  .field span{display:block;font-size:12px;color:#C9788F;margin-bottom:5px;font-weight:700;}
  .field input,.field textarea,.field select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #F0D3DB;font-size:15px;background:#FCF4F5;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #E79AB0;background:#fff;}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 6px;color:#5A4A50;}
  .row-end{display:flex;justify-content:flex-end;margin-top:8px;gap:8px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .btn{border:none;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn.primary{background:#C9788F;color:#fff;}
  .btn.ghost2{background:#FBEAEE;color:#C9788F;}
  .err{color:#C0392B;font-size:13px;margin:6px 0;}
  .ok{color:#5B8A45;font-size:13px;margin-top:10px;}
  .tiny{color:#94808A;font-size:11px;margin-top:8px;line-height:1.6;}
  .done{text-align:center;color:#5B8A45;}
  .done p{color:#5A4A50;}
  .count{color:#94808A;font-size:13px;}
  .empty{color:#94808A;font-size:13px;text-align:center;padding:20px;}
  .steps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:12px;}
  .steps li{display:flex;align-items:center;gap:12px;font-size:14px;color:#5A4A50;}
  .step-no{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#F6D4DD;color:#C9788F;display:grid;place-items:center;font-weight:700;font-size:13px;}
  .install-actions{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .install-actions .btn{width:100%;justify-content:center;}
  .link-btn{background:transparent;border:none;color:#94808A;font-size:13px;cursor:pointer;text-decoration:underline;}

  .inside{max-width:720px;margin:0 auto;min-height:100vh;}
  .ins-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid #F0D3DB;position:sticky;top:0;z-index:10;}
  .ins-title{font-family:"Zen Maru Gothic";font-weight:700;color:#B25E77;}
  .ghost{background:transparent;border:none;color:#C9788F;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:13px;}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#FBEAEE;position:sticky;top:53px;z-index:9;}
  .tab{white-space:nowrap;border:1px solid #F0D3DB;background:#fff;color:#94808A;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px;}
  .tab.on{background:#E79AB0;color:#fff;border-color:#E79AB0;font-weight:700;}
  .ins-body{padding:18px 16px 70px;}
  .sec-title{font-size:20px;color:#B25E77;margin:0 0 4px;}
  .sec-note{color:#94808A;font-size:13px;margin:0 0 16px;line-height:1.6;}

  .tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(201,120,143,.08);}
  .tbl th{background:#FBEAEE;color:#C9788F;width:74px;text-align:center;padding:12px;font-size:14px;vertical-align:top;}
  .tbl td{padding:12px 14px;border-top:1px solid #F0D3DB;font-size:14px;}

  .grid2{display:grid;grid-template-columns:1fr;gap:12px;}
  .work-card{background:#fff;border-radius:16px;padding:16px;border:1px solid #F0D3DB;border-left:5px solid #E79AB0;}
  .work-card h3{margin:0 0 6px;color:#C9788F;font-size:15px;}

}

    setData(d);
    const standalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
    if(!standalone && !localStorage.getItem("mizuho_install_done")) setShowInstall(true);
  })();},[]);

  const persist=(next)=>{setData(next);save(next);};
  const doLogin=async()=>{const h=await sha256(pw);
    if(login&&h===login.hash){setMe(login);setLogin(null);setPw("");setErr("");setTab("schedule");}
    else setErr("パスワードが違います。");};
  const dismissInstall=(never)=>{if(never)localStorage.setItem("mizuho_install_done","1");setShowInstall(false);};

  if(!data) return <div style={{padding:40,color:"#C9788F"}}>読み込み中…</div>;

  return <div>
    {showInstall && <InstallPrompt onNever={()=>dismissInstall(true)} onLater={()=>dismissInstall(false)}/>}
    {me
      ? <Inside me={me} data={data} tab={tab} setTab={setTab} onLogout={()=>setMe(null)} persist={persist}/>
      : <Top data={data} season={season} onPick={a=>{setLogin(a);setErr("");}} onAdminReg={()=>setAdminReg(true)} onHotaru={()=>setHotaruOpen(true)}/>}

    {login && <Modal title={`${login.name} さん  ―  パスワード`} onClose={()=>{setLogin(null);setPw("");setErr("");}}>
      <p className="hint">🔒 このアプリの内容を見るにはパスワードが必要です。</p>
      <Field label="パスワード" type="password" value={pw} autoFocus onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()}/>
      {err&&<p className="err">{err}</p>}
      <div className="row-end"><Btn onClick={doLogin}>ログイン</Btn></div>
      <p className="tiny">デモのパスワードは「1234」です。</p>
    </Modal>}

    {adminReg && <AdminRegister data={data} persist={persist} onClose={()=>setAdminReg(false)}/>}

    {hotaruOpen && <Modal title="ほたる理念アプリへ" tint="#8C7A2E" onClose={()=>setHotaruOpen(false)}>
      {data.hotaruUrl
        ? <><p className="hint">✨ 別アプリ「ほたる理念」を開きます。</p><div className="row-end"><a className="btn primary" href={data.hotaruUrl} target="_blank" rel="noreferrer">開く ↗</a></div></>
        : <p className="hint">ℹ️ まだリンク先が未設定です。「ほたる理念」のURLが決まったら、管理者パネル →「連携アプリ」で登録できます。</p>}
    </Modal>}
  </div>;
}

/* ========================= 管理者登録 ========================= */
function AdminRegister({data,persist,onClose}){
  const [step,setStep]=useState(1);
  const [master,setMaster]=useState(""); const [name,setName]=useState("");
  const [p1,setP1]=useState(""); const [p2,setP2]=useState(""); const [msg,setMsg]=useState("");
  const checkMaster=async()=>{const h=await sha256(master); if(h===data.master){setStep(2);setMsg("");}else setMsg("管理者登録用パスワードが違います。");};
  const create=async()=>{
    if(!name.trim())return setMsg("お名前を入力してください。");
    if(p1.length<4)return setMsg("パスワードは4文字以上にしてください。");
    if(p1!==p2)return setMsg("パスワードが一致しません。");
    const hash=await sha256(p1);
    persist({...data,accounts:[...data.accounts,{id:uid(),name:name.trim(),hash,isAdmin:true}]}); setMsg("done");
  };
  return <Modal title="管理者の登録" onClose={onClose}>
    {step===1&&<>
      <p className="hint">🔑 管理者を登録できるのは、登録用パスワードを知っている方だけです。</p>
      <Field label="管理者登録用パスワード" type="password" value={master} autoFocus onChange={e=>setMaster(e.target.value)} onKeyDown={e=>e.key==="Enter"&&checkMaster()}/>
      {msg&&msg!=="done"&&<p className="err">{msg}</p>}
      <div className="row-end"><Btn onClick={checkMaster}>次へ</Btn></div>
      <p className="tiny">デモの登録用パスワードは「mizuho2025」です。</p>
    </>}
    {step===2&&msg!=="done"&&<>
      <Field label="管理者のお名前" value={name} onChange={e=>setName(e.target.value)}/>
      <Field label="パスワード" type="password" value={p1} onChange={e=>setP1(e.target.value)}/>
      <Field label="パスワード（もう一度）" type="password" value={p2} onChange={e=>setP2(e.target.value)}/>
      {msg&&<p className="err">{msg}</p>}
      <div className="row-end"><Btn onClick={create}>登録する</Btn></div>
    </>}
    {msg==="done"&&<div className="done"><p>「{name}」さんを管理者として登録しました。</p><div className="row-end"><Btn onClick={onClose}>閉じる</Btn></div></div>}
  </Modal>;
}

/* ============================ AI相談 ============================ */
function Consult({data}){
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState(""); const [loading,setLoading]=useState(false); const [error,setError]=useState("");
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("mizuho_api_key")||"");
  const [setup,setSetup]=useState(false); const [keyInput,setKeyInput]=useState("");
  const endRef=useRef(null);
  useEffect(()=>{endRef.current&&endRef.current.scrollIntoView({behavior:"smooth"});},[messages,loading]);
  const starters=["感覚過敏があり、集団活動が苦手な方への配慮は？","予定変更でパニックになったときの落ち着き方は？","本人の「やりたい」を引き出す関わり方を知りたい"];
  const saveKey=()=>{localStorage.setItem("mizuho_api_key",keyInput.trim());setApiKey(keyInput.trim());setSetup(false);};

  const send=async(text)=>{
    const content=(text??input).trim(); if(!content||loading)return;
    if(!apiKey){setSetup(true);return;}
    const history=[...messages,{role:"user",content}];
    setMessages(history);setInput("");setLoading(true);setError("");
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"content-type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-5",max_tokens:1024,system:buildSystem(data),messages:history.map(m=>({role:m.role,content:m.content}))}),
      });
      const d=await res.json();
      if(d.error){setError("AIからの応答でエラーが出ました："+(d.error.message||"")); setMessages(history); }
      else{ const txt=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
        setMessages([...history,{role:"assistant",content:txt||"うまく答えられませんでした。もう一度お試しください。"}]); }
    }catch(e){ setError("AI相談に接続できませんでした。通信状況やAPIキーをご確認ください。"); setMessages(history); }
    finally{ setLoading(false); }
  };

  return <Section title="AI相談" note="支援の対応に迷ったとき、一緒に考えます。研修資料・ほたる理念・意思決定支援・虐待防止・強度行動障害・身体介助の考え方も参考にします。">
    <div className="ai-note"><span>💛</span><div>ご本人が特定される情報（氏名など）は書かず、状況として相談してください。回答は参考です。最終判断はチームとご本人の意思で。
      {" "}<button className="link-btn" onClick={()=>{setKeyInput(apiKey);setSetup(true);}}>AIの設定</button></div></div>
    {!apiKey&&<div className="privacy" style={{marginBottom:12}}><span>🔑</span><div>
      <b>AI相談を使うには設定が必要です</b>
      <p>この公開版では、AI相談にAnthropicのAPIキーが必要です（この端末にのみ保存されます）。「AIの設定」から入力してください。共用端末では設定しないなど、取り扱いにご注意ください。</p></div></div>}
    <div className="chat">
      {messages.length===0&&!loading&&<div className="chat-empty"><p>気になることを話しかけてみてください。例えば…</p>
        <div className="starters">{starters.map(s=><button key={s} className="starter" onClick={()=>send(s)}>{s}</button>)}</div></div>}
      {messages.map((m,i)=><div key={i} className={"bubble "+m.role}>{m.content}</div>)}
      {loading&&<div className="bubble assistant loading">考えています…</div>}
      <div ref={endRef}/>
    </div>
    {error&&<p className="err">{error}</p>}
    <div className="composer">
      <textarea rows={1} value={input} placeholder="相談したいことを入力…" onChange={e=>setInput(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}/>
      <button className="send" onClick={()=>send()} disabled={loading} aria-label="送信">➤</button>
    </div>
    {setup&&<Modal title="AIの設定" tint="#C9788F" onClose={()=>setSetup(false)}>
      <p className="hint">🔑 AnthropicのAPIキーを入力してください。この端末のブラウザにのみ保存されます。</p>
      <Field label="APIキー" type="password" value={keyInput} onChange={e=>setKeyInput(e.target.value)} placeholder="sk-ant-..."/>
      <div className="row-end"><Btn kind="ghost2" onClick={()=>{localStorage.removeItem("mizuho_api_key");setApiKey("");setKeyInput("");}}>消去</Btn><Btn onClick={saveKey}>保存</Btn></div>
      <p className="tiny">キーは console.anthropic.com で発行できます。取り扱いにご注意ください（共用端末では保存しない等）。</p>
    </Modal>}
  </Section>;
}

function AdminPanel({data,persist}){
  const [name,setName]=useState(""); const [p1,setP1]=useState(""); const [p2,setP2]=useState("");
  const [isAdmin,setIsAdmin]=useState(false); const [msg,setMsg]=useState("");
  const [hotaru,setHotaru]=useState(data.hotaruUrl||""); const [phil,setPhil]=useState(data.philosophy||"");
  const [pwFor,setPwFor]=useState(null); const [np1,setNp1]=useState(""); const [np2,setNp2]=useState("");
  const [m1,setM1]=useState(""); const [m2,setM2]=useState("");
  const add=async()=>{
    if(!name.trim())return setMsg("お名前を入力してください。");
    if(p1.length<4)return setMsg("パスワードは4文字以上にしてください。");
    if(p1!==p2)return setMsg("パスワードが一致しません。");
    const hash=await sha256(p1);
    persist({...data,accounts:[...data.accounts,{id:uid(),name:name.trim(),hash,isAdmin}]});
    setName("");setP1("");setP2("");setIsAdmin(false);setMsg("追加しました。");
  };
  const remove=(id)=>{ if(!confirm("このアカウントを削除しますか？"))return; persist({...data,accounts:data.accounts.filter(a=>a.id!==id)}); };
  const saveHotaru=()=>{persist({...data,hotaruUrl:hotaru.trim()});setMsg("連携アプリのURLを保存しました。");};
  const savePhil=()=>{persist({...data,philosophy:phil});setMsg("ほたる理念を保存しました。AI相談でも参考にされます。");};
  const changePw=async()=>{
    if(np1.length<4)return setMsg("パスワードは4文字以上にしてください。");
    if(np1!==np2)return setMsg("パスワードが一致しません。");
    const hash=await sha256(np1);
    persist({...data,accounts:data.accounts.map(a=>a.id===pwFor.id?{...a,hash}:a)});
    const nm=pwFor.name; setPwFor(null);setNp1("");setNp2("");setMsg(`「${nm}」さんのパスワードを変更しました。`);
  };
  const saveMaster=async()=>{
    if(m1.length<4)return setMsg("登録用パスワードは4文字以上にしてください。");
    if(m1!==m2)return setMsg("パスワードが一致しません。");
    const master=await sha256(m1); persist({...data,master}); setM1("");setM2("");setMsg("管理者登録用パスワードを変更しました。");
  };
  return <Section title="管理者パネル" note="アカウントの登録・削除、理念や連携アプリの設定ができます。">
    <div className="grid2">
      <div><h3 className="blk">登録済みのアカウント</h3>
        <div className="acc-list">{data.accounts.map(a=>(
          <div key={a.id} className="acc"><span className="avatar sm">{a.name.slice(0,1)}</span>
            <span className="acc-nm">{a.name}{a.isAdmin&&<span className="tag">管理者</span>}</span>
            <span className="acc-actions">
              <button className="mini-key" onClick={()=>{setPwFor(a);setNp1("");setNp2("");}} title="パスワード変更">🔑</button>
              <button className="del" onClick={()=>remove(a.id)} title="削除">🗑</button>
            </span></div>))}</div></div>
      <div><h3 className="blk">＋ 新しく登録する</h3>
        <Field label="お名前" value={name} onChange={e=>setName(e.target.value)}/>
        <Field label="パスワード" type="password" value={p1} onChange={e=>setP1(e.target.value)}/>
        <Field label="パスワード（もう一度）" type="password" value={p2} onChange={e=>setP2(e.target.value)}/>
        <label className="check"><input type="checkbox" checked={isAdmin} onChange={e=>setIsAdmin(e.target.checked)}/> この方を管理者にする</label>
        <div className="row-end"><Btn onClick={add}>登録する</Btn></div></div>
    </div>
    <h3 className="blk">✨ ほたる理念</h3>
    <Area label="理念の内容（AI相談の参考にもなります）" rows={4} value={phil} onChange={e=>setPhil(e.target.value)} placeholder="ほたる理念の内容を入力してください。"/>
    <div className="row-end"><Btn kind="ghost2" onClick={savePhil}>理念を保存</Btn></div>
    <h3 className="blk">🔗 連携アプリ（ほたる理念）</h3>
    <Field label="ほたる理念アプリのURL" placeholder="https://…" value={hotaru} onChange={e=>setHotaru(e.target.value)}/>
    <div className="row-end"><Btn kind="ghost2" onClick={saveHotaru}>URLを保存</Btn></div>
    <h3 className="blk">🔐 管理者登録用パスワードの変更</h3>
    <Field label="新しい登録用パスワード" type="password" value={m1} onChange={e=>setM1(e.target.value)}/>
    <Field label="もう一度" type="password" value={m2} onChange={e=>setM2(e.target.value)}/>
    <div className="row-end"><Btn kind="ghost2" onClick={saveMaster}>変更する</Btn></div>
    {msg&&<p className="ok">{msg}</p>}
    {pwFor&&<Modal title={`${pwFor.name} さんのパスワード変更`} tint="#C9788F" onClose={()=>{setPwFor(null);setNp1("");setNp2("");}}>
      <Field label="新しいパスワード" type="password" value={np1} autoFocus onChange={e=>setNp1(e.target.value)}/>
      <Field label="新しいパスワード（もう一度）" type="password" value={np2} onChange={e=>setNp2(e.target.value)}/>
      <div className="row-end"><Btn onClick={changePw}>変更する</Btn></div>
    </Modal>}
  </Section>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
